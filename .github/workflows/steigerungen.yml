name: Steigerungen

on:
  schedule:
    - cron: '17 5 * * *'   # täglich ca. 06:17/07:17 Schweizer Zeit
  workflow_dispatch:
    inputs:
      tage:
        description: 'Wie viele Tage zurück abfragen (Bestand: 120)'
        default: '10'

permissions:
  contents: write

concurrency:
  group: steigerungen

jobs:
  abfrage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: node scripts/steigerungen.mjs --tage ${{ github.event.inputs.tage || '10' }}
      - run: node scripts/validate-daten.mjs
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/data/steigerungen.json
          git diff --cached --quiet || git commit -m "Steigerungen aktualisiert $(date +%F)"
          git push
